<!DOCTYPE html>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;background:#2a2824;font-family:system-ui,sans-serif;min-height:100%}
#m{max-width:720px;margin:0 auto;min-height:100vh;padding:max(10px,env(safe-area-inset-top)) 10px 16px;background:linear-gradient(#d6cfb8,#bcb49b)}

.bez::after{content:"";position:absolute;inset:10px;border-radius:14px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 40px #000}

#kb{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}
</style></head><body>
<div id="m">
 <div class="hd"><span class="logo">IBM</span><span class="mod">5100</span><span class="sub">PORTABLE COMPUTER</span>

<input id="kb" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send">
<script>
//ENGINE-START
const COLS=64;
function BasicEngine(io){
  const E=m=>{throw {basic:m}};
  let prog={},vars={};
  const fmt=n=>{if(typeof n==='string')return n;if(Number.isInteger(n)&&Math.abs(n)<1e15)return String(n);return String(parseFloat(n.toPrecision(6))).replace('e+','E+').replace('e-','E-')};
  const upc=s=>s.split('"').map((x,i)=>i%2?x:x.toUpperCase()).join('"');
  function tok(s){const t=[];let i=0,m;
    while(i<s.length){const c=s[i];
      if(c===' '){i++;continue}
      if(c==='"'){let j=s.indexOf('"',i+1);if(j<0)j=s.length;t.push({k:'s',v:s.slice(i+1,j)});i=j+1;continue}
      if((m=/^(\d+\.?\d*|\.\d+)(E[+-]?\d+)?/.exec(s.slice(i)))){t.push({k:'n',v:parseFloat(m[0])});i+=m[0].length;continue}
      if((m=/^[A-Z][A-Z0-9]*\$?/.exec(s.slice(i)))){t.push({k:'i',v:m[0]});i+=m[0].length;continue}
      const two=s.substr(i,2);if(['<=','>=','<>','><'].includes(two)){t.push({k:'o',v:two==='><'?'<>':two});i+=2;continue}
      t.push({k:'o',v:c});i++}
    return t}
  const num=v=>{if(typeof v!=='number')E('TYPE MISMATCH');return v};
  const FN={SIN:Math.sin,COS:Math.cos,TAN:Math.tan,ATN:Math.atan,EXP:Math.exp,
    LOG:x=>{if(x<=0)E('BAD ARGUMENT');return Math.log(x)},SQR:x=>{if(x<0)E('BAD ARGUMENT');return Math.sqrt(x)},
    ABS:Math.abs,INT:Math.floor,SGN:Math.sign,RND:()=>Math.random(),LEN:s=>s.length,
    'LEFT$':(s,n)=>s.slice(0,n),'RIGHT$':(s,n)=>n?s.slice(-n):'','MID$':(s,i,n)=>s.substr(i-1,n===undefined?1e9:n),
    'CHR$':n=>String.fromCharCode(n),ASC:s=>s.charCodeAt(0)||0,'STR$':n=>fmt(n),VAL:s=>parseFloat(s)||0,
    TAB:n=>' '.repeat(Math.max(0,n)),SPC:n=>' '.repeat(Math.max(0,n))};
  function P(t){let p=0;
    const isO=v=>t[p]&&t[p].k==='o'&&t[p].v===v, isI=v=>t[p]&&t[p].k==='i'&&t[p].v===v;
    const nx=()=>t[p++];
    function args(){const a=[];if(!isO(')')){do{a.push(or())}while(isO(',')&&++p)}if(!isO(')'))E('SYNTAX');p++;return a}
    function prim(){const a=nx();if(!a)E('SYNTAX');
      if(a.k==='n'||a.k==='s')return a.v;
      if(a.k==='o'){if(a.v==='('){const v=or();if(!isO(')'))E('SYNTAX');p++;return v}
        if(a.v==='-')return -num(pw());if(a.v==='+')return num(pw());E('SYNTAX')}
      const n=a.v;
      if(isO('(')){p++;const ar=args();if(Object.prototype.hasOwnProperty.call(FN,n))return FN[n](...ar);
        const key=n+'('+ar.join(',')+')';return vars[key]!==undefined?vars[key]:(n.endsWith('$')?'':0)}
      if(n==='RND')return Math.random();if(n==='PI')return Math.PI;
      return vars[n]!==undefined?vars[n]:(n.endsWith('$')?'':0)}
    function pw(){let a=prim();while(isO('^')){p++;a=Math.pow(num(a),num(prim()))}return a}
    function mul(){let a=pw();while(isO('*')||isO('/')){const o=t[p++].v,b=pw();num(a);num(b);if(o==='/'&&b===0)E('DIVISION BY ZERO');a=o==='*'?a*b:a/b}return a}
    function add(){let a=mul();while(isO('+')||isO('-')){const o=t[p++].v,b=mul();if(o==='+'){if(typeof a!==typeof b)E('TYPE MISMATCH');a=a+b}else a=num(a)-num(b)}return a}
    function cmp(){let a=add();while(t[p]&&t[p].k==='o'&&['=','<','>','<=','>=','<>'].includes(t[p].v)){const o=t[p++].v,b=add();if(typeof a!==typeof b)E('TYPE MISMATCH');
      a=+({'=':a===b,'<':a<b,'>':a>b,'<=':a<=b,'>=':a>=b,'<>':a!==b}[o])}return a}
    function not(){if(isI('NOT')){p++;return +!num(not())}return cmp()}
    function and(){let a=not();while(isI('AND')){p++;const b=not();a=+(num(a)&&num(b))}return a}
    function or(){let a=and();while(isI('OR')){p++;const b=and();a=+(num(a)||num(b))}return a}
    return {or,t,isO,nx,get p(){return p},set p(v){p=v}}}
  const evalList=s=>{const x=P(tok(s));const a=[];if(x.t.length){do{a.push(x.or())}while(x.isO(',')&&++x.p)}return a};
  const KW=['PRINT','LET','INPUT','IF','GOTO','GOSUB','RETURN','FOR','NEXT','END','STOP','REM','DIM','RANDOMIZE','CLS'];
  function splitStmts(s){if(/^\s*REM/.test(s))return[s.trim()];const r=[];let q=false,cur='';
    for(const c of s){if(c==='"')q=!q;if(c===':'&&!q){r.push(cur.trim());cur=''}else cur+=c}r.push(cur.trim());return r.filter(x=>x)}
  async function exec(st,S){
    if(st[0]==='?')st='PRINT'+st.slice(1);
    const kw=KW.find(k=>st.startsWith(k));const rest=kw?st.slice(kw.length).trim():st;
    switch(kw){
      case 'REM':case 'DIM':case 'RANDOMIZE':return;
      case 'CLS':io.cls();return;
      case 'END':case 'STOP':S.done=true;return;
      case 'PRINT':{const x=P(tok(rest));let nl=true;
        while(x.p<x.t.length){
          if(x.isO(';')){x.p++;nl=false;continue}
          if(x.isO(',')){x.p++;io.put(' '.repeat(16-io.col()%16));nl=false;continue}
          const v=x.or();io.put(typeof v==='number'?fmt(v)+' ':v);nl=true}
        if(nl)io.nl();return}
      case 'INPUT':{const tk=tok(rest),x=P(tk);let prompt='';
        if(tk[0]&&tk[0].k==='s'){prompt=tk[0].v;x.p=1;if(x.isO(';')||x.isO(','))x.p++}
        const names=[];
        while(x.p<tk.length){const a=x.nx();
          if(a.k==='i'){let n=a.v;if(x.isO('(')){x.p++;const ar=[];do{ar.push(x.or())}while(x.isO(',')&&++x.p);x.p++;n=n+'('+ar.join(',')+')'}names.push(n)}
          else if(!(a.k==='o'&&a.v===','))E('SYNTAX')}
        io.put(prompt+'? ');
        for(;;){const line=await io.read();if(line===null){S.done=true;return}
          const parts=line.split(',');let ok=true;const vals=[];
          names.forEach((n,i)=>{const raw=(parts[i]||'').trim();
            if(n.includes('$'))vals.push(raw);else if(raw===''||isNaN(+raw))ok=false;else vals.push(+raw)});
          if(ok){names.forEach((n,i)=>vars[n]=vals[i]);return}
          io.put('REENTER? ')}}
      case 'IF':{const m=/^(.*?)\s*(THEN|GOTO)\s*(.*)$/.exec(rest);if(!m)E('SYNTAX');
        const v=P(tok(m[1])).or();
        if(!v){S.si=S.cur.length;return}
        if(m[2]==='GOTO'||/^\d+$/.test(m[3]))S.goto(parseInt(m[3]));else S.cur.splice(S.si,0,...splitStmts(m[3]));return}
      case 'GOTO':S.goto(parseInt(rest));return;
      case 'GOSUB':S.stack.push({li:S.li,si:S.si});S.goto(parseInt(rest));return;
      case 'RETURN':{const r=S.stack.pop();if(!r)E('RETURN WITHOUT GOSUB');S.restore(r.li,r.si);return}
      case 'FOR':{const m=/^([A-Z][A-Z0-9]*)\s*=\s*(.*?)\s+TO\s+(.*?)(?:\s+STEP\s+(.*))?$/.exec(rest);if(!m)E('SYNTAX');
        const ev=s=>num(P(tok(s)).or());
        vars[m[1]]=ev(m[2]);S.loops.push({v:m[1],end:ev(m[3]),step:m[4]?ev(m[4]):1,li:S.li,si:S.si});return}
      case 'NEXT':{const name=rest.split(',')[0].trim();
        while(S.loops.length&&name&&S.loops[S.loops.length-1].v!==name)S.loops.pop();
        const L=S.loops[S.loops.length-1];if(!L)E('NEXT WITHOUT FOR');
        vars[L.v]+=L.step;
        if(L.step>=0?vars[L.v]<=L.end:vars[L.v]>=L.end)S.restore(L.li,L.si);else S.loops.pop();return}
      default:{const m=/^([A-Z][A-Z0-9]*\$?)\s*(\(.*\))?\s*=\s*(.*)$/.exec(kw==='LET'?rest:st);if(!m)E('SYNTAX');
        const key=m[2]?m[1]+'('+evalList(m[2].slice(1,-1)).join(',')+')':m[1];
        const v=P(tok(m[3])).or();
        if(m[1].endsWith('$')!==(typeof v==='string'))E('TYPE MISMATCH');
        vars[key]=v}}}
  async function run(lines,src,imm){
    const st=lines.map(n=>splitStmts(src[n]));
    const S={li:0,si:0,cur:st[0]?st[0].slice():null,stack:[],loops:[],done:false};
    const enter=l=>{S.li=l;S.si=0;S.cur=st[l]?st[l].slice():null};
    S.goto=n=>{if(imm)E('LINE NOT FOUND');const l=lines.indexOf(n);if(l<0)E('LINE NOT FOUND '+n);enter(l)};
    S.restore=(l,s)=>{enter(l);S.si=s};
    let cnt=0;
    try{
      while(!S.done){
        while(S.li<lines.length&&S.si>=S.cur.length)enter(S.li+1);
        if(S.li>=lines.length)break;
        if(++cnt%500===0){await io.tick();if(io.attn()){io.fresh();io.put('ATTN AT '+lines[S.li]);io.nl();return}}
        await exec(S.cur[S.si++],S)}
    }catch(e){if(e&&e.basic){io.fresh();io.put('?'+e.basic+(imm?'':' IN '+lines[S.li]));io.nl()}else throw e}}
  const sorted=()=>Object.keys(prog).map(Number).sort((a,b)=>a-b);
  async function line(raw){
    const s=upc(raw.trim());if(!s)return;
    let m=/^(\d+)\s*(.*)$/.exec(s);
    if(m){if(m[2])prog[+m[1]]=m[2];else delete prog[+m[1]];return}
    const w=s.split(/\s+/)[0],arg=s.slice(w.length).trim();
    if(w==='RUN'){vars={};const ls=sorted();if(ls.length)await run(ls,prog,false);return}
    if(w==='LIST'){let[a,b]=arg?arg.split('-').map(Number):[0,1e9];if(b===undefined||isNaN(b))b=arg?a:1e9;
      sorted().filter(n=>n>=a&&n<=b).forEach(n=>{io.put(n+' '+prog[n]);io.nl()});return}
    if(w==='NEW'){prog={};vars={};return}
    if(w==='SAVE'){if(!arg){io.print(['?NAME NEEDED']);return}localStorage.setItem('i5100:'+arg,JSON.stringify(prog));io.print(['SAVED '+arg]);return}
    if(w==='LOAD'){const d=localStorage.getItem('i5100:'+arg);if(!d){io.print(['?NOT FOUND']);return}prog=JSON.parse(d);vars={};io.print(['LOADED '+arg]);return}
    if(w==='CAT'){io.print(Object.keys(localStorage).filter(k=>k.startsWith('i5100:')).map(k=>k.slice(6)));return}
    if(w==='APL'){io.mode('APL',true);return}
    if(w==='DEMO'){prog={10:'FOR I=1 TO 10',20:'PRINT I,I*I',30:'NEXT I'};io.print(['DEMO LOADED - TYPE RUN']);return}
    if(w==='HELP'){io.print(['RUN LIST NEW SAVE n LOAD n CAT DEMO','PRINT INPUT LET IF-THEN GOTO GOSUB RETURN','FOR-TO-STEP NEXT END REM  ( ? = PRINT )','SWITCH TO APL: SWITCH ABOVE OR TYPE APL']);return}
    await run([0],{0:s},true)}
  return {line}}

function AplEngine(io){
  const E=m=>{throw {apl:m}};
  let vars={};
  const A=(d,s)=>({s:s||[d.length],d}), sc=x=>({s:[],d:[x]}), isC=x=>typeof x==='string';
  const N=x=>typeof x==='number'?x:E('DOMAIN ERROR');
  const FUNCS=new Set('+-×÷*⌈⌊|!⍟○~?⍳⍴,⌽⍉↑↓⍋⍒=≠<>≤≥∧∨∊'.split(''));
  function tok(s){const t=[];let i=0,m;
    while(i<s.length){const c=s[i];
      if(c===' '){i++;continue}
      if(c==='⍝')break;
      if(c==="'"){let j=i+1,str='';for(;;){if(j>=s.length)E('SYNTAX ERROR');if(s[j]==="'"){if(s[j+1]==="'"){str+="'";j+=2;continue}break}str+=s[j++]}
        t.push({k:'v',v:str.length===1?sc(str):A([...str])});i=j+1;continue}
      if((m=/^¯?(\d+\.?\d*|\.\d+)(E¯?\d+)?/.exec(s.slice(i)))){t.push({k:'v',v:sc(parseFloat(m[0].replace(/¯/g,'-')))});i+=m[0].length;continue}
      if((m=/^[A-Za-z∆][A-Za-z0-9_∆]*/.exec(s.slice(i)))){t.push({k:'n',v:m[0]});i+=m[0].length;continue}
      t.push({k:'g',v:c==='^'?'∧':c==='ρ'?'⍴':c==='∈'?'∊':c});i++}
    return t}
  function items(t){const out=[];let i=0;
    while(i<t.length){const x=t[i];
      if(x.k==='g'&&x.v==='('){let d=1,j=i+1;while(j<t.length&&d){if(t[j].k==='g'){if(t[j].v==='(')d++;else if(t[j].v===')')d--}j++}
        if(d)E('SYNTAX ERROR');const it=items(t.slice(i+1,j-1));const r=exec(it);if(r===null)E('SYNTAX ERROR');out.push({t:'v',v:r});i=j;continue}
      if(x.k==='n'){if(t[i+1]&&t[i+1].k==='g'&&t[i+1].v==='←'){out.push({t:'asn',n:x.v});i+=2}else{out.push({t:'n',n:x.v});i++}continue}
      if(x.k==='v'){out.push({t:'v',v:x.v});i++;continue}
      const g=x.v,nx=t[i+1],n2=t[i+2];
      if(g==='∘'&&nx&&nx.v==='.'&&n2&&n2.k==='g'){out.push({t:'f',outer:1,f:n2.v});i+=3;continue}
      if(g==='/'&&out.length&&'vn'.includes(out[out.length-1].t)){out.push({t:'f',f:'/'});i++;continue}
      if(FUNCS.has(g)){
        if(nx&&nx.v==='.'&&n2&&n2.k==='g'&&FUNCS.has(n2.v)){out.push({t:'f',inner:1,f:g,g:n2.v});i+=3;continue}
        if(nx&&nx.k==='g'&&(nx.v==='/'||nx.v==='\\')){out.push({t:'f',op:nx.v,f:g});i+=2;continue}
        out.push({t:'f',f:g});i++;continue}
      E('SYNTAX ERROR')}
    return out}
  function exec(it){let i=it.length-1;
    const val=x=>x.t==='v'?x.v:(vars[x.n]||E('VALUE ERROR'));
    const strand=()=>{const vs=[];while(i>=0&&(it[i].t==='v'||it[i].t==='n')){vs.unshift(val(it[i]));i--}
      if(!vs.length)return null;if(vs.length===1)return vs[0];
      return A(vs.map(v=>v.d.length===1?v.d[0]:E('RANK ERROR')))};
    let r=strand();
    while(i>=0){const f=it[i];
      if(f.t==='asn'){if(r===null)E('SYNTAX ERROR');vars[f.n]=r;i--;continue}
      if(f.t!=='f')E('SYNTAX ERROR');
      i--;if(r===null)E('SYNTAX ERROR');
      let l=null;if(i>=0&&(it[i].t==='v'||it[i].t==='n'))l=strand();
      r=apply(f,l,r)}
    return r}
  function apply(f,l,r){
    if(f.outer){if(!l)E('SYNTAX ERROR');return outer(f.f,l,r)}
    if(f.inner){if(!l)E('SYNTAX ERROR');return inner(f.f,f.g,l,r)}
    if(f.op==='/'){if(l)E('SYNTAX ERROR');return reduce(f.f,r)}
    if(f.op==='\\'){if(l)E('SYNTAX ERROR');return scan(f.f,r)}
    return l?dyad(f.f,l,r):monad(f.f,r)}
  const SD={'+':(a,b)=>N(a)+N(b),'-':(a,b)=>N(a)-N(b),'×':(a,b)=>N(a)*N(b),
    '÷':(a,b)=>{N(a);N(b);if(b===0){if(a===0)return 1;E('DOMAIN ERROR')}return a/b},
    '*':(a,b)=>{const v=Math.pow(N(a),N(b));if(isNaN(v))E('DOMAIN ERROR');return v},
    '⌈':(a,b)=>Math.max(N(a),N(b)),'⌊':(a,b)=>Math.min(N(a),N(b)),
    '|':(a,b)=>{N(a);N(b);return a===0?b:b-a*Math.floor(b/a)},
    '=':(a,b)=>+(a===b),'≠':(a,b)=>+(a!==b),'<':(a,b)=>+(N(a)<N(b)),'>':(a,b)=>+(N(a)>N(b)),'≤':(a,b)=>+(N(a)<=N(b)),'≥':(a,b)=>+(N(a)>=N(b)),
    '∧':(a,b)=>+(N(a)!==0&&N(b)!==0),'∨':(a,b)=>+(N(a)!==0||N(b)!==0),
    '⍟':(a,b)=>Math.log(N(b))/Math.log(N(a)),
    '○':(a,b)=>{const f={1:Math.sin,2:Math.cos,3:Math.tan}[N(a)];if(!f)E('DOMAIN ERROR');return f(N(b))},
    '!':(a,b)=>{N(a);N(b);let v=1;for(let k=1;k<=a;k++)v=v*(b-a+k)/k;return Math.round(v)}};
  const SM={'+':a=>N(a),'-':a=>-N(a),'×':a=>Math.sign(N(a)),'÷':a=>{if(N(a)===0)E('DOMAIN ERROR');return 1/a},
    '*':a=>Math.exp(N(a)),'⌈':a=>Math.ceil(N(a)),'⌊':a=>Math.floor(N(a)),'|':a=>Math.abs(N(a)),
    '!':a=>{N(a);if(a<0||a%1)E('DOMAIN ERROR');let f=1;for(let k=2;k<=a;k++)f*=k;return f},
    '⍟':a=>{if(N(a)<=0)E('DOMAIN ERROR');return Math.log(a)},'○':a=>Math.PI*N(a),
    '~':a=>{if(N(a)!==0&&a!==1)E('DOMAIN ERROR');return 1-a},
    '?':a=>{if(N(a)<1)E('DOMAIN ERROR');return 1+Math.floor(Math.random()*a)}};
  function pervade(fn,l,r){
    if(l.d.length===1&&l.s.length<=r.s.length)return{s:r.s,d:r.d.map(x=>fn(l.d[0],x))};
    if(r.d.length===1&&r.s.length<=l.s.length)return{s:l.s,d:l.d.map(x=>fn(x,r.d[0]))};
    if(l.s.length!==r.s.length)E('RANK ERROR');
    if(l.s.some((v,k)=>v!==r.s[k]))E('LENGTH ERROR');
    return{s:l.s,d:l.d.map((x,k)=>fn(x,r.d[k]))}}
  const vec=a=>a.s.length<=1?a:{s:[a.d.length],d:a.d};
  function monad(g,r){
    if(SM[g])return{s:r.s,d:r.d.map(SM[g])};
    switch(g){
      case '⍳':{const n=N(r.d[0]);if(n<0||n%1)E('DOMAIN ERROR');return A(Array.from({length:n},(_,k)=>k+1))}
      case '⍴':return A(r.s.slice());
      case ',':return A(r.d.slice());
      case '⌽':{if(r.s.length<2)return A(r.d.slice().reverse());const n=r.s[r.s.length-1],d=[];
        for(let q=0;q<r.d.length;q+=n)d.push(...r.d.slice(q,q+n).reverse());return{s:r.s,d}}
      case '⍉':{if(r.s.length<2)return r;if(r.s.length>2)E('RANK ERROR');const[m,n]=r.s,d=[];
        for(let j=0;j<n;j++)for(let k=0;k<m;k++)d.push(r.d[k*n+j]);return{s:[n,m],d}}
      case '↑':return sc(r.d.length?r.d[0]:0);
      case '⍋':case '⍒':{const d=r.d,ix=[...d.keys()];
        ix.sort((a,b)=>(d[a]<d[b]?-1:d[a]>d[b]?1:0)*(g==='⍒'?-1:1)||a-b);return A(ix.map(k=>k+1))}
      default:E('SYNTAX ERROR')}}
  function dyad(g,l,r){
    if(SD[g])return pervade(SD[g],l,r);
    switch(g){
      case '⍴':{const dims=l.d.map(N),cnt=dims.reduce((a,b)=>a*b,1);
        return{s:dims,d:Array.from({length:cnt},(_,k)=>r.d.length?r.d[k%r.d.length]:0)}}
      case ',':if(l.s.length>1||r.s.length>1)E('RANK ERROR');return A(l.d.concat(r.d));
      case '↑':{const n=N(l.d[0]),v=r.d,fill=isC(v[0])?' ':0,a=Math.abs(n);
        const body=n>=0?v.slice(0,a):v.slice(Math.max(0,v.length-a)),pad=Array(Math.max(0,a-body.length)).fill(fill);
        return A(n>=0?body.concat(pad):pad.concat(body))}
      case '↓':{const n=N(l.d[0]);return A(n>=0?r.d.slice(n):r.d.slice(0,Math.max(0,r.d.length+n)))}
      case '⍳':return{s:r.s,d:r.d.map(x=>{const k=l.d.indexOf(x);return k<0?l.d.length+1:k+1})};
      case '∊':return{s:l.s,d:l.d.map(x=>+r.d.includes(x))};
      case '⌽':{const len=r.d.length;if(!len)return r;const k=((N(l.d[0])%len)+len)%len;return A(r.d.slice(k).concat(r.d.slice(0,k)))}
      case '/':{const c=l.d.length===1?r.d.map(()=>l.d[0]):l.d,v=r.d.length===1?c.map(()=>r.d[0]):r.d;
        if(c.length!==v.length)E('LENGTH ERROR');const d=[];c.forEach((n,k)=>{for(let q=0;q<N(n);q++)d.push(v[k])});return A(d)}
      case '?':{const n=N(l.d[0]),m=N(r.d[0]);if(n>m)E('DOMAIN ERROR');const p=Array.from({length:m},(_,k)=>k+1);
        for(let k=p.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[p[k],p[j]]=[p[j],p[k]]}return A(p.slice(0,n))}
      default:E('SYNTAX ERROR')}}
  function reduce(g,r){
    if(r.s.length===0)return r;
    const n=r.s[r.s.length-1];
    if(n===0){const id={'+':0,'×':1,'⌈':-1e307,'⌊':1e307}[g];if(id===undefined)E('DOMAIN ERROR');return sc(id)}
    const rows=r.d.length/n,out=[];
    for(let q=0;q<rows;q++){let acc=sc(r.d[q*n+n-1]);for(let k=n-2;k>=0;k--)acc=dyad(g,sc(r.d[q*n+k]),acc);out.push(acc.d[0])}
    return r.s.length===1?sc(out[0]):{s:r.s.slice(0,-1),d:out}}
  function scan(g,r){if(r.s.length!==1)return r;return A(r.d.map((_,k)=>reduce(g,A(r.d.slice(0,k+1))).d[0]))}
  function outer(g,l,r){const d=[];l.d.forEach(a=>r.d.forEach(b=>d.push(dyad(g,sc(a),sc(b)).d[0])));return{s:l.s.concat(r.s),d}}
  function inner(f,g,l,r){const lr=l.s.length,rr=r.s.length;if(lr>2||rr>2)E('RANK ERROR');
    if(lr<=1&&rr<=1)return reduce(f,dyad(g,l,r));
    const m=lr===2?l.s[0]:1,k=lr?l.s[lr-1]:1,kk=rr?r.s[0]:1,n=rr===2?r.s[1]:1;if(k!==kk)E('LENGTH ERROR');
    const d=[];for(let a=0;a<m;a++)for(let b=0;b<n;b++){
      const row=Array.from({length:k},(_,x)=>l.d[a*k+x]),col=Array.from({length:k},(_,x)=>r.d[x*n+b]);
      d.push(reduce(f,dyad(g,A(row),A(col))).d[0])}
    return{s:(lr===2?[m]:[]).concat(rr===2?[n]:[]),d}}
  function fmtN(x){if(isC(x))return x;if(x<0)return '¯'+fmtN(-x);if(Number.isInteger(x)&&x<1e10)return String(x);
    return String(parseFloat(x.toPrecision(10))).replace('e+','E').replace('e-','E¯')}
  function show(a){const r=a.s.length,allC=a.d.length>0&&a.d.every(isC);
    if(r===0)return[fmtN(a.d[0])];
    if(r===1)return[allC?a.d.join(''):a.d.map(fmtN).join(' ')];
    const n=a.s[r-1],rows=n?a.d.length/n:0,plane=a.s[r-2],out=[];
    const cw=Array.from({length:n},(_,j)=>Math.max(...Array.from({length:rows},(_,i)=>fmtN(a.d[i*n+j]).length)));
    for(let i=0;i<rows;i++){if(i&&i%plane===0)out.push('');
      const row=a.d.slice(i*n,i*n+n);out.push(allC?row.join(''):row.map((x,j)=>fmtN(x).padStart(cw[j])).join(' '))}
    return out}
  function line(raw){const s=raw.trim();if(!s)return;
    if(s[0]===')'){const c=s.slice(1).toUpperCase().split(/\s+/)[0];
      if(c==='CLEAR'){vars={};io.print(['CLEAR WS']);return}
      if(c==='VARS'){io.print([Object.keys(vars).sort().join(' ')]);return}
      if(c==='BASIC'){io.mode('BASIC',true);return}
      io.print(['INCORRECT COMMAND']);return}
    try{const toks=tok(s),stmts=[];let cur=[],d=0;
      for(const x of toks){if(x.k==='g'){if(x.v==='(')d++;if(x.v===')')d--;if(x.v==='⋄'&&d===0){stmts.push(cur);cur=[];continue}}cur.push(x)}
      stmts.push(cur);
      for(const st of stmts){if(!st.length)continue;const it=items(st),r=exec(it);if(r===null)E('SYNTAX ERROR');if(it[0].t!=='asn')io.print(show(r))}
    }catch(e){if(e&&e.apl)io.print([e.apl,'      '+s,'      ^']);else throw e}}
  return {line}}
//ENGINE-END

const $=id=>document.getElementById(id);
const crt=$('crt'),kb=$('kb');
const scr={rows:[''],buf:'',inp:false};
let mode='BASIC',pend=null,busy=false,ATTN=false,blink=true;
const hist=[];let hi=0;
function draw(){const rows=scr.rows.slice(),last=rows.pop();
  const full=last+(scr.inp?scr.buf:'')+(scr.inp&&blink?'\u2588':'');
  crt.textContent=rows.concat(full.match(/.{1,64}/g)||['']).slice(-16).join('\n')}
const io={
  put(s){for(const ch of String(s)){if(ch==='\n'){scr.rows.push('');continue}
    if(scr.rows[scr.rows.length-1].length>=COLS)scr.rows.push('');scr.rows[scr.rows.length-1]+=ch}
    if(scr.rows.length>400)scr.rows.splice(0,scr.rows.length-400);draw()},
  nl(){scr.rows.push('');draw()},
  col(){return scr.rows[scr.rows.length-1].length%COLS},
  fresh(){if(scr.rows[scr.rows.length-1].length)io.nl()},
  cls(){scr.rows=[''];draw()},
  print(l){l.forEach(x=>{io.put(x);io.nl()})},
  tick:()=>new Promise(r=>setTimeout(r,0)),
  attn(){const a=ATTN;ATTN=false;return a},
  read(){return new Promise(res=>{pend=res;scr.inp=true;scr.buf='';kb.value='';draw()})},
  mode(m,force){setMode(m,force)}};
function release(v){if(pend){const r=pend;pend=null;scr.inp=false;scr.buf='';kb.value='';draw();r(v)}}
function submit(){if(!pend)return;const line=scr.buf;if(line.trim())hist.push(line);hi=hist.length;
  scr.inp=false;io.put(line);io.nl();const r=pend;pend=null;scr.buf='';kb.value='';r(line)}
function setVal(v){kb.value=v;scr.buf=v;draw()}
function ins(t){setVal(kb.value+t);kb.focus()}
const PAL={BASIC:['RUN\n','LIST\n','NEW\n','PRINT ','INPUT ','IF ',' THEN ','GOTO ','GOSUB ','RETURN','FOR ',' TO ',' STEP ','NEXT ','END','DEMO\n','HELP\n','"','(',')','=','<','>',',',';',':','+','-','*','/','^','$'],
  APL:['←','⍳','⍴','⌈','⌊','×','÷','¯','⌽','⍉','∘.','↑','↓','⍋','⍒','≤','≥','≠','∧','∨','~','⍟','○','!','?','|','∊','⋄','⍝','(',')','+/','×/','/','\\','.','+.×']};
function pal(){$('pal').innerHTML='';PAL[mode].forEach(t=>{const b=document.createElement('button');b.className='k';b.textContent=t.trim();b.dataset.t=t;$('pal').appendChild(b)})}
function setMode(m,force){if(m===mode||(busy&&!force))return;mode=m;
  $('bB').classList.toggle('on',m==='BASIC');$('bA').classList.toggle('on',m==='APL');pal();
  io.fresh();io.print(['** '+m+' **']);kb.value='';scr.buf='';release(null)}
document.addEventListener('pointerdown',e=>{if(e.target.closest('button'))e.preventDefault()});
document.addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
$('bB').onclick=()=>setMode('BASIC');$('bA').onclick=()=>setMode('APL');
$('m').addEventListener('click',e=>{const b=e.target.closest('button');
  if(!b){if(e.target.closest('.bez'))kb.focus();return}
  if(b.dataset.t!==undefined){const t=b.dataset.t;if(t.endsWith('\n')){setVal(t.trim());submit()}else ins(t);return}
  const a=b.dataset.a;
  if(a==='exec'){submit();kb.focus()}
  else if(a==='attn'){if(busy){ATTN=true;release(null)}else setVal('')}
  else if(a==='back')setVal(kb.value.slice(0,-1));
  else if(a==='clr')setVal('');
  else if(a==='up'){if(hist.length){hi=Math.max(0,hi-1);setVal(hist[hi])}}
  else if(a==='kbd'){document.activeElement===kb?kb.blur():kb.focus()}});
kb.addEventListener('input',()=>{if(mode==='BASIC'&&kb.value!==kb.value.toUpperCase())kb.value=kb.value.toUpperCase();scr.buf=kb.value;draw()});
kb.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}else if(e.key==='ArrowUp'){e.preventDefault();$('m').querySelector('[data-a=up]').click()}});
function fit(){const s=document.createElement('span');s.style.cssText='position:absolute;visibility:hidden;white-space:pre;font:bold 100px "Courier New",Courier,monospace';
  s.textContent='M'.repeat(COLS);document.body.appendChild(s);const w=s.getBoundingClientRect().width;s.remove();if(!w)return;
  crt.style.fontSize=Math.floor((crt.clientWidth-16)/w*100*10)/10+'px'}
addEventListener('resize',fit);
setInterval(()=>{blink=!blink;if(scr.inp)draw()},500);
const bas=BasicEngine(io),apl=AplEngine(io);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function boot(){busy=true;$('lb').classList.add('on');$('m').classList.add('busy');
  io.print(['IBM 5100 PORTABLE COMPUTER','']);io.put('');
  for(let k=0;k<=64;k+=8){scr.rows[scr.rows.length-1]='STORAGE TEST '+k+'K';draw();await sleep(70)}
  io.nl();io.print(['STORAGE OK','','** BASIC **','TYPE HELP, OR TAP APL TO SWITCH']);busy=false;$('lb').classList.remove('on');$('m').classList.remove('busy')}
async function main(){fit();pal();await boot();
  for(;;){io.fresh();if(mode==='APL')io.put('      ');
    const l=await io.read();if(l===null)continue;
    busy=true;$('lb').classList.add('on');$('m').classList.add('busy');
    try{if(mode==='BASIC')await bas.line(l);else apl.line(l)}
    catch(e){io.fresh();io.put('SYSTEM ERROR: '+(e&&e.message||e));io.nl()}
    busy=false;$('lb').classList.remove('on');$('m').classList.remove('busy')}}
main();
</script>
